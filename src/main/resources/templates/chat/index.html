<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FCM Web Push Demo</title>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyOAGJXyRgiv9x0n2aR7st8JWBQrD2jOU",
            authDomain: "boost-10b95.firebaseapp.com",
            projectId: "boost-10b95",
            storageBucket: "boost-10b95.firebasestorage.app",
            messagingSenderId: "395235624993",
            appId: "1:395235624993:web:4e37500651417e0508bb60",
            measurementId: "G-9GHSK0ZMSX"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        // 서비스워커 등록 및 FCM 토큰 요청
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(async (registration) => {
                console.log('✅ Service Worker 등록 성공:', registration.scope);

                const token = await getToken(messaging, {
                    vapidKey: "BITra8_KuTa_jPUUx6q8TOIbKrjdmmQgF_OFnb7dtQeSpmvz_Rdx2UlerMZTK-SuIYl804_9NkeNEtj2K__bj34", // 반드시 실제 VAPID 키로 교체!
                    serviceWorkerRegistration: registration
                });

                if (token) {
                    console.log("📬 FCM Token:", token);
                    // 서버에 전송하려면 여기서 fetch POST 호출 가능
                } else {
                    console.warn("❌ 토큰 없음. 권한 허용 여부 확인 필요.");
                }
            })
            .catch((err) => {
                console.error("❌ Service Worker 등록 실패:", err);
            });

        // 알림 수신 핸들러 (브라우저가 열려 있을 때)
        onMessage(messaging, (payload) => {
            console.log('📨 수신된 메시지:', payload);
            alert(`푸시 알림 수신: ${payload.notification?.title}`);
        });
    </script>
</head>
<body>
<h1>🚀 Firebase Cloud Messaging 테스트</h1>
<p>브라우저에서 알림 권한을 허용하고, 푸시 메시지를 받을 준비가 됩니다.</p>
</body>
</html>
